version: 1.0.0
services:

  # database
  db:
    image: 
      postgres: 16.9
    environments:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes_from:
      - /var/lib/postgres/data

  # backend
  server_1.0:
    build: .
    env_file:
      - .env
    depends_on:
      -db
    ports:
      - "8000:5000"
    environments:


  volumes:
      - postgres_data
